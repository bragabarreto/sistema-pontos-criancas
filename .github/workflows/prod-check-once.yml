# Validação pontual da produção após o deploy das correções de estabilidade.
# Roda apenas em pushes desta branch de trabalho; será removido em seguida.
name: Validar produção (pontual)

on:
  push:
    branches:
      - claude/system-stability-check-yqltty

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar /api/health e página inicial
        run: |
          echo "== /api/health =="
          curl -s -w '\nHTTP %{http_code} em %{time_total}s\n' --max-time 30 \
            https://sistema-pontos-criancas.vercel.app/api/health || true
          echo "== / (home) =="
          curl -s -o /dev/null -w 'HTTP %{http_code} em %{time_total}s\n' --max-time 30 \
            https://sistema-pontos-criancas.vercel.app/ || true

name: Health Check (keep-alive)

# Pinga o /api/health a cada 5 minutos para:
# 1. Manter o banco Neon acordado (plano free hiberna após ~5min ocioso,
#    causando lentidão/erros no primeiro acesso)
# 2. Detectar indisponibilidade: o workflow falha se o sistema estiver fora
#
# Nota: agendamentos do GitHub Actions podem atrasar alguns minutos em
# horários de pico; o retry do frontend cobre os cold starts residuais.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: |
          for attempt in 1 2 3; do
            response=$(curl -s -w '\n%{http_code}' --max-time 30 \
              https://sistema-pontos-criancas.vercel.app/api/health) && {
              body=$(echo "$response" | head -n -1)
              status=$(echo "$response" | tail -n 1)
              echo "Tentativa $attempt: HTTP $status - $body"
              [ "$status" = "200" ] && exit 0
            }
            sleep 10
          done
          echo "::error::Health check falhou após 3 tentativas"
          exit 1
